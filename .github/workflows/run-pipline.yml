# 사료축산뉴스 큐레이션 파이프라인 워크플로
# 트리거: workflow_dispatch(수동, memo 입력 가능) / schedule(매주 자동)

name: 사료축산뉴스 파이프라인 실행

run-name: "회차 #${{ github.run_number }}: ${{ inputs.memo || '자동 스케줄 실행' }}"

permissions:
  contents: write  # data/ 결과물 커밋/푸시용

on:
  workflow_dispatch:
    inputs:
      memo:
        description: '이번 회차에 남길 메모(선택)'
        required: false
        default: '수동 실행 메모 없음'
  schedule:
    - cron: "0 9 * * 0"  # 매주 일요일 18:01 KST = 일요일 9:01 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  collect:
    # [1] 수집만 담당. 자기 몫 360분 온전히 사용, 결과는 job2에 artifact로 전달.
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: 실행 메모 기록
        run: |
          echo "## 📝 실행 메모" >> "$GITHUB_STEP_SUMMARY"
          echo "- **회차:** #${{ github.run_number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **트리거:** ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **메모:** ${{ inputs.memo || '(자동 스케줄 실행 - 메모 없음)' }}" >> "$GITHUB_STEP_SUMMARY"

      - name: 실행 전 디스크 사용량 확인
        run: df -h /

      - name: 사용 안 하는 프리인스톨 툴 정리
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저(Chromium) 설치
        run: playwright install --with-deps chromium

      - name: apt 캐시 정리
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: 수집 실행 (main.py collect)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KEYWORD_SHEET_CSV_URL: ${{ vars.KEYWORD_SHEET_CSV_URL }}
        run: python -u main.py collect

      - name: 수집 결과를 job2로 전달 (artifact 업로드)
        uses: actions/upload-artifact@v4
        with:
          name: collected-articles-${{ github.run_id }}
          path: collected_articles.json
          retention-days: 1

  process:
    # [2]~[6] 정규화~배포. job1 완료 후 시작, 자기 몫 360분 새로 받음.
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 리포 체크아웃
        uses: actions/checkout@v4

      - name: 수집 결과 받기 (artifact 다운로드)
        uses: actions/download-artifact@v4
        with:
          name: collected-articles-${{ github.run_id }}

      - name: 실행 전 디스크 사용량 확인
        run: df -h /

      - name: 사용 안 하는 프리인스톨 툴 정리
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: Python 3.11 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: PyTorch(CPU 전용) 우선 설치
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: 파이썬 의존성 설치
        run: pip install -r requirements.txt --no-cache-dir

      - name: Playwright 브라우저(Chromium) 설치
        run: playwright install --with-deps chromium

      - name: 한글 폰트(나눔고딕) 설치
        run: sudo apt-get install -y fonts-nanum

      - name: apt 캐시 정리 + 설치 후 디스크 사용량 확인
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          df -h /

      - name: BGE-M3 임베딩 모델 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-m3-model

      - name: 처리+배포 실행 (main.py process)
        env:
          KEYWORD_SHEET_CSV_URL: ${{ vars.KEYWORD_SHEET_CSV_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # 판단형(그룹핑/필터/재분류)
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          OPENROUTER_MODEL_2: ${{ vars.OPENROUTER_MODEL_2 }}
          OPENROUTER_MODEL_3: ${{ vars.OPENROUTER_MODEL_3 }}
          # 생성형(요약)
          OPENROUTER_MODEL_SUMMARY: ${{ vars.OPENROUTER_MODEL_SUMMARY }}
          OPENROUTER_MODEL_SUMMARY_2: ${{ vars.OPENROUTER_MODEL_SUMMARY_2 }}
          OPENROUTER_MODEL_SUMMARY_3: ${{ vars.OPENROUTER_MODEL_SUMMARY_3 }}
          TOP_N: ${{ vars.TOP_N }}
          CATEGORY_TOP_N: ${{ vars.CATEGORY_TOP_N }}
          SIMILARITY_DEBUG_CSV: ${{ vars.SIMILARITY_DEBUG_CSV }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: python -u main.py process

      - name: 유사도 디버그 CSV 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: similarity-debug-${{ github.run_id }}
          path: similarity_debug/similarity_scores.csv
          if-no-files-found: warn
          retention-days: 14

      - name: 저장 결과물(data/, state/) 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -d data/ ]; then
            git add data/
          fi
          if [ -d state/ ]; then
            git add state/
          fi
          if git diff --cached --quiet; then
            echo "data/, state/ 변경 사항 없음 - 커밋 생략"
          else
            git commit -m "chore: 사료축산뉴스 큐레이션 결과 저장 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
